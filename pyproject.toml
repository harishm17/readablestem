[project]
name = "readablestem"
version = "0.1.0"
description = "Assists with making STEM course materials accessible: PDF in, HTML with MathML equations, figure alt text and headings out."
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Harish Manoharan", email = "harishmanoharan17@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.0",
    "authlib>=1.8.0",
    "defusedxml>=0.7.1",
    "fastapi>=0.142.4",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "latex2mathml>=3.81.1",
    "markupsafe>=3.0",
    "numpy>=2.3",
    "onnxruntime>=1.31.0,<1.32",
    "openai>=3.26.0",
    "pillow>=12.0",
    "psycopg[binary]>=3.3.6",
    "py3langid>=0.4.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pymupdf==1.28.2",
    "pymupdf-layout==2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.4",
    "structlog>=26.1.0",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# Langfuse tracing (off by default; inputs are masked when on).
tracing = ["langfuse>=4.17.0"]

[project.scripts]
readablestem = "readablestem.cli.main:main"

[tool.uv.build-backend]
module-name = "readablestem"

[build-system]
requires = ["uv_build>=0.12.23,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
    # Embedded Postgres for local tests (no wheels for 3.13+; CI uses a service container).
    "pgserver>=0.1.4; python_version < '3.13'",
]
# Headless Chromium: axe-core checks on generated HTML, and rendering gold equations to
# images for the end-to-end eval. Install browsers with: uv run playwright install chromium
browser = [
    "playwright>=1.63.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

# Registered files are kept byte for byte (their SHA-256 is in proof/PREREG-v2.sha256), so the
# formatter and the linter leave them alone.
extend-exclude = ["proof/selection", "proof/scorer-readiness/draw.py", "proof/scorer-readiness/make_pred.py"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
]
# Maths text legitimately uses these (U+2212 minus sign, U+2032 prime, U+0394 Delta).
allowed-confusables = ["\u2212", "\u2032", "\u0394"]

[tool.ruff.lint.per-file-ignores]
# Registered file, kept as registered (apart from the name): its import block is not sorted and the new name made a line longer.
"proof/interim/report.py" = ["I001", "E501"]
# Hand-written LaTeX of the registered scorer-readiness sample: long lines and Unicode on purpose.
"proof/scorer-readiness/*" = ["E501", "RUF001", "RUF002", "RUF003"]
# The Unicode "holes" table maps letters to their look-alike styled forms on purpose.
"src/readablestem/core/mathchars.py" = ["RUF001"]
# Look-alike dashes, minus signs and relations are what the sign check is about.
"src/readablestem/pipeline/signs.py" = ["RUF001", "RUF002", "RUF003"]
"tests/test_sign_check.py" = ["RUF001", "RUF002", "RUF003"]
# Imports the `env` fixture of test_web_worker.py to use it.
"tests/test_web_worker_poll.py" = ["F811"]
# Fences, arrows, minus and dash signs are what the extended development set classifies by.
"src/readablestem/gold/devset_classify.py" = ["RUF001"]
# Imports the `site` fixture of test_web_pipeline.py to use it.
"tests/test_web_review_lazy_html.py" = ["F811"]
# Hand-written OOXML parts are single long strings.
"tests/fixtures/office.py" = ["E501"]
# Styled maths letters (the reals, a script L) are what these tests check.
"tests/test_letter_style_fonts.py" = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not network and not live_model and not browser and not slow'"
markers = [
    "network: hits the live OpenStax API (run with: uv run pytest -m network)",
    "live_model: calls the real OpenAI or Anthropic API and costs money (run with: uv run pytest -m live_model)",
    "browser: needs Playwright Chromium (run with: uv run pytest -m browser)",
    "postgres: needs a Postgres server (DATABASE_URL or embedded pgserver)",
    "slow: minutes-long upgrade checks (run with: make fuzz-tables)",
]
