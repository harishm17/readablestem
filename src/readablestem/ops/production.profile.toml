# What the production image carries, written by the image build (`readablestem ops image-facts
# --write`, Dockerfile), never typed. In the repository every fact is "unknown", and every
# reader treats unknown as not present: a switch that needs a program (`NEEDS_PROGRAM` in
# ops/profile.py) counts as off unless its program is here. "none" means the build looked and
# it is not installed. lxml is a development-only dependency, so the image should say "none".
# tex_names is how many TeX distribution names the build wrote for source/support.py.
# This table must stay the last one in the file: the build replaces it to the end.
[image_facts]
tex = "unknown"
install_tex_witness = "unknown"
latexml = "unknown"
pandoc = "unknown"
libreoffice = "unknown"
lxml = "unknown"
tex_names = "unknown"
