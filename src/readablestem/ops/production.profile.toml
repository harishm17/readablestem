# The production profile (WS0.9): what production runs, in the repository.
#
# Every setting of src/readablestem/config.py is either a behaviour setting under [settings],
# with its production value and where that value came from, or named in `operations` (secrets,
# addresses, accounts, spend and size limits, timeouts), never valued. tests/test_profile.py
# fails for a setting that is in neither, and for a [settings] name that config.py or
# .railway/railway.ts does not have. Read by src/readablestem/ops/profile.py.
#
# How the values were found: nobody has read the hosting dashboard for this file yet. Each value
# was taken from what the repository itself states, with the file, line and commit in `source`.
# Where the repository states no production value the code default is written and the source
# says "not stated; code default". Until the owner has read the dashboard and corrected this
# file, `confirmed` stays false: a production start whose settings differ from it names each
# differing setting (log line `profile_mismatch`, /admin) and still starts. With `confirmed =
# true` a difference refuses the start.
#
# Each setting that turns a behaviour on or off, or picks a model, may carry two more fields:
# `reason` (one sentence: why production has this value) and `eval` (the repository path of the
# report or registration that measured it, or "none"). Where the repository states no reason
# the row says "not stated"; nobody has filled one in from memory. They are shown on /admin and
# are not part of the hash. There is no owner field: one person, the project owner, owns every
# switch in this file.
#
# A setting whose value is None in config.py is written "unset". MAIN_MODEL and CHEAP_MODEL are
# the values config.py resolves them to under MODEL_PROVIDER=anthropic.
#
# Changing a value here changes the profile's hash (shown on /healthz/ops and /admin, and
# stamped on every eval report); reordering lines or editing comments does not.

