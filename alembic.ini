# Alembic configuration for the a11y-stem database (production: Postgres).
#
# Apply migrations:   uv run a11y-stem db upgrade      (same as: uv run alembic upgrade head)
# New migration:      DATABASE_URL=sqlite:////tmp/empty.db uv run alembic revision --autogenerate -m "..."
#
# The database URL is NOT stored here: migrations/env.py reads DATABASE_URL (or the
# app settings, which also read .env). Never put credentials in this file.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
path_separator = os
# Revision files are named <date>_<rev>_<slug>.py so they sort in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
timezone = UTC

[post_write_hooks]
hooks = ruff_format
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
