name: Eval guard

# A pull request that changes a model constant in config.py, a prompt under
# src/readablestem/models/prompts/, or a rule that decides acceptance (a constant or accept
# function in a pipeline step, found by scripts/eval_guard.py) must also change the matching
# data/eval report: the latest-*.json of the model's task, or the replay record
# data/eval/burden-corpus.json for an acceptance rule, so the change was measured. Logic and
# the report mapping: scripts/eval_guard.py (tests: tests/test_eval_guard.py). Opt-out for a
# change that does not alter what a model is asked, which model answers or what is accepted:
# the label `eval-unchanged`, or a commit trailer `Eval-Unchanged: <reason>` (docs/eval.md,
# "Eval guard"). Spends nothing.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: eval-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  guard:
    name: model and prompt changes carry their eval report
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Values from the event reach the shell as environment variables, never pasted into
      # the script (a label or branch name is attacker-controlled text).
      - name: Check the change against the committed reports
        env:
          BASE_REF: ${{ github.base_ref }}
          LABELS_JSON: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/eval_guard.py --base "origin/${BASE_REF}" --head HEAD --labels-json "$LABELS_JSON"
