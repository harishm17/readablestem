name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Actions are pinned to full commit SHAs (tag in the comment). Tags and SHAs checked with
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` on 2026-10-06. setup-uv publishes no
# floating major tag (no `v10`), so it must be pinned to an exact release.

jobs:
  lint-test:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      # Includes tests/test_gold_sample.py: known-correct LaTeX must match the gold sample.
      - name: Pytest (offline; live OpenStax test is opt-in with -m network)
        run: uv run pytest

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    # Runs the gitleaks CLI directly over the full history. gitleaks-action failed on the
    # repo's first push: it scans "<first commit>^..HEAD", and the root commit has no parent.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.24.3 (checksum-verified)
        run: |
          set -euo pipefail
          V=8.24.3
          base="https://github.com/gitleaks/gitleaks/releases/download/v$V"
          curl -sSfL -o gitleaks.tgz "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt | sed "s/gitleaks_${V}_linux_x64.tar.gz/gitleaks.tgz/" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
