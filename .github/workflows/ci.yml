name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs (tag in the comment). Tags and SHAs checked with
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` on 2026-10-07. setup-uv publishes no
# floating major tag (no `v10`), so it must be pinned to an exact release. Dependabot
# (.github/dependabot.yml) proposes updates weekly.

jobs:
  lint-test:
    name: ruff + ty + pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # The tracing extra (Langfuse) is optional at runtime but its code is type-checked
      # and its masking is tested, so CI installs it. The browser group adds only the
      # playwright Python package: `ty check src` must resolve `playwright.sync_api`
      # (eval/render.py, pipeline/html_checks.py). No browser binaries are installed, so
      # tests that need Chromium stay deselected by the `browser` marker.
      - name: Install (locked)
        run: uv sync --locked --all-extras --group browser
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check src
      # Includes tests/test_gold_sample.py: known-correct LaTeX must match the gold sample.
      # On 3.12 the Postgres tests also run, against the embedded pgserver.
      - name: Pytest (offline; live OpenStax and model tests are opt-in)
        run: uv run pytest

  proof-replay:
    name: make proof (replay of the recorded run)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_NO_DEV: "1"  # so that `uv run` in the make targets does not install the dev group
      # Where the tag's code looks for the table-structure model (TABLE_MODEL_DIR).
      TABLE_MODEL_DIR: ${{ github.workspace }}/table-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # The recorded run belongs to the pipeline as it was at the tag proof-heldout-2026-10
      # (Makefile PROOF_TAG; tests/test_proof_pin.py keeps the names equal). Later commits
      # change model requests, so their replay misses recorded answers, by design. This job
      # therefore checks the recording's integrity on the branch head and replays it at the
      # tag, in a second directory. The tag must exist on the remote (it is pushed, never
      # moved). Replay needs no key, no browser and no network: it feeds the committed model
      # answers through the real pipeline and scoring code. The job fails if the pins or the
      # bundle's hashes do not match, if the replay does not reproduce the recorded numbers,
      # or if the committed PROOF.md at the tag is not what the command writes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: proof-heldout-2026-10
          path: at-tag
          persist-credentials: false
      - name: Install (locked, no dev tools, no browser)
        run: uv sync --locked --no-dev
      - name: Check the pins and the recorded run (branch head)
        run: make proof-check
      - name: Install at the tag (locked, no dev tools, no browser)
        working-directory: at-tag
        run: uv sync --locked --no-dev
      # The recorded run was made with the SLANet-plus table-structure model present. It is
      # not in the repository (7.5 MB, Apache-2.0, pinned by SHA-256 in the tag's
      # pipeline/table_model.py). Without it tables fall back to PyMuPDF's grid, the model
      # requests differ, and the replay stops with "64 request(s) have no recorded answer".
      # The cache key names the pinned checksum; the tag's own `make table-model` fetches
      # the file and refuses anything that does not match that checksum.
      - name: Cache the table-structure model
        id: table-model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: table-model
          key: table-model-slanet-plus-d57a942af6a2f57d6a4a0372573c696a2379bf5857c45e2ac69993f3b334514b
      - name: Fetch the table-structure model (checksum-verified by the tag's code)
        if: steps.table-model-cache.outputs.cache-hit != 'true'
        working-directory: at-tag
        run: |
          for attempt in 1 2 3 4; do
            make table-model && exit 0
            echo "fetch attempt $attempt failed; retrying"; sleep $((attempt * 15))
          done
          exit 1
      - name: Replay at the tag and write PROOF.md
        working-directory: at-tag
        run: make proof
      - name: PROOF.md at the tag is what the command writes
        working-directory: at-tag
        run: git diff --exit-code -- PROOF.md

  site:
    name: make site (static demo, no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      # The build reads committed files only (no key, no network, no browser). It imports
      # the app's own message and compare helpers, so it needs the locked project install.
      - name: Install (locked)
        run: uv sync --locked
      - name: Build the site
        run: make site
      - name: The site has its pages
        run: |
          test -f site/_build/index.html
          test -f site/_build/examples/index.html
          test -f site/_build/before-after/index.html
      # The same files twice must give the same bytes.
      - name: The build is repeatable
        run: |
          uv run python site/build.py --out site/_build_again
          diff -r site/_build site/_build_again

  postgres:
    name: pytest -m postgres (Postgres 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: a11y_test
          # Throwaway container reachable only from this job; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d a11y_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/a11y_test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/a11y_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras
      # tests/test_ops_backup.py runs pg_dump and pg_restore against the service container
      # (locally pgserver ships them). The client major version must match the service's
      # (postgres:16); Ubuntu 24.04 packages 16.
      - name: Install the Postgres 16 client tools (pg_dump, pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16
          pg_dump --version
      # Exit code 5 means no test carries the marker yet; anything else is a real result.
      - name: Pytest (Postgres-marked tests only)
        run: |
          set +e
          uv run pytest -m postgres
          status=$?
          if [ "$status" -eq 5 ]; then echo "::warning::no postgres tests collected"; exit 0; fi
          exit "$status"

  browser:
    name: pytest -m browser (Playwright Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked, with the browser group)
        run: uv sync --locked --all-groups --all-extras
      - name: Install Chromium and its system libraries
        run: uv run playwright install --with-deps chromium
      # The fonts the eval renderer and the browser tests name (eval/render.py: Noto Sans
      # Math, Liberation Serif). Without them Chromium falls back to other fonts and the
      # printed PDFs differ from the ones the tests were written against.
      - name: Install the fonts the printed test pages use
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-liberation
      - name: Pytest (browser-marked tests only, including axe-core checks)
        run: |
          set +e
          uv run pytest -m browser
          status=$?
          if [ "$status" -eq 5 ]; then echo "::warning::no browser tests collected"; exit 0; fi
          exit "$status"

  docker:
    name: docker build (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag readablestem:ci .
      # deploy.sh builds with `gcloud builds submit --tag`: a plain `docker build` in Cloud
      # Build's docker 20.10 image, which can use the legacy builder. This runner defaults
      # to BuildKit, so build once more without it to catch BuildKit-only syntax.
      - name: Build again with the legacy builder (as Cloud Build may)
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build --tag readablestem:legacy .
      - name: Smoke test the entry point and the non-root user
        run: |
          docker run --rm readablestem:ci readablestem --version
          docker run --rm readablestem:ci readablestem ops --help
          test "$(docker run --rm readablestem:ci id -u)" = "10001"

  eval-gate:
    name: eval gate (when a baseline exists)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for committed baselines (data/eval/baseline-<task>.json)
        id: files
        run: |
          if ls data/eval/baseline-*.json >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no eval baseline committed yet; gate skipped"
          fi
      - if: steps.files.outputs.present == 'true'
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
          enable-cache: true
      - if: steps.files.outputs.present == 'true'
        name: Install (locked)
        run: uv sync --locked
      - if: steps.files.outputs.present == 'true'
        name: Fail if any task's latest eval regressed against its baseline
        run: |
          set -euo pipefail
          for baseline in data/eval/baseline-*.json; do
            task="${baseline#data/eval/baseline-}"; task="${task%.json}"
            current="data/eval/latest-${task}.json"
            if [ ! -f "$current" ]; then
              echo "::error::$baseline has no matching $current"; exit 1
            fi
            uv run readablestem eval gate --require-current --current "$current" --baseline "$baseline"
          done

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs the gitleaks CLI directly over the full history. gitleaks-action failed on the
    # repo's first push: it scans "<first commit>^..HEAD", and the root commit has no parent.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.24.3 (checksum-verified)
        run: |
          set -euo pipefail
          V=8.24.3
          base="https://github.com/gitleaks/gitleaks/releases/download/v$V"
          curl -sSfL -o gitleaks.tgz "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt | sed "s/gitleaks_${V}_linux_x64.tar.gz/gitleaks.tgz/" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full git history
        run: ./gitleaks git --redact --verbose --exit-code 1 .
