name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * *"  # nightly, 03:41 UTC: the full suite on Python 3.14 (see `changes`)
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels the run it supersedes. Runs on main, the
# nightly run and manual runs are never cancelled, so every main commit keeps its result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Actions are pinned to full commit SHAs (tag in the comment). Tags and SHAs checked with
# `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` on 2026-10-07 (artifact actions on
# 2026-11-03). setup-uv publishes no floating major tag (no `v10`), so it must be pinned to
# an exact release. Dependabot (.github/dependabot.yml) proposes updates weekly.

jobs:
  # Decides how much of the Python 3.14 leg runs, and builds the pytest matrix.
  #   Python 3.12: always the full suite, in SHARDS shards.
  #   Python 3.14: the full suite (same shards) on a push to main, the nightly schedule, a
  #   manual run, and a pull request that touches pyproject.toml, uv.lock, .python-version or
  #   this file. Any other pull request runs a smoke: one shard in SMOKE_OF of the suite
  #   (a spread over every area, chosen by recorded duration), plus ruff, ty and an import
  #   of every module on 3.14 in `static`. docs/development.md ("CI") states the rule.
  changes:
    name: plan (what runs on Python 3.14)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SHARDS: "4"
      SMOKE_OF: "8"
      EVENT: ${{ github.event_name }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      full314: ${{ steps.plan.outputs.full314 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: plan
        run: |
          set -euo pipefail
          full=true
          if [ "$EVENT" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            # The checkout is the PR's merge commit, so this diff is the PR's own change.
            if git diff --name-only "$BASE_SHA" HEAD \
                | grep -E -q '^(pyproject\.toml|uv\.lock|\.python-version|\.github/workflows/ci\.yml)$'; then
              full=true
            else
              full=false
            fi
          fi
          python3 - "$full" "$SHARDS" "$SMOKE_OF" >> "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          full, shards, smoke_of = sys.argv[1] == "true", int(sys.argv[2]), int(sys.argv[3])
          legs = [
              {"python": "3.12", "shard": f"{i}/{shards}", "name": f"Python 3.12, shard {i}/{shards}"}
              for i in range(1, shards + 1)
          ]
          if full:
              legs += [
                  {"python": "3.14", "shard": f"{i}/{shards}", "name": f"Python 3.14, shard {i}/{shards}"}
                  for i in range(1, shards + 1)
              ]
          else:
              legs.append(
                  {"python": "3.14", "shard": f"1/{smoke_of}", "name": f"Python 3.14, smoke 1/{smoke_of}"}
              )
          print("matrix=" + json.dumps({"include": legs}))
          print("full314=" + str(full).lower())
          PY

  static:
    name: ruff + ty (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # The tracing extra (Langfuse) is optional at runtime but its code is type-checked
      # and its masking is tested, so CI installs it. The browser group adds only the
      # playwright Python package: `ty check src` must resolve `playwright.sync_api`
      # (eval/render.py, pipeline/html_checks.py). No browser binaries are installed, so
      # tests that need Chromium stay deselected by the `browser` marker.
      - name: Install (locked)
        run: uv sync --locked --all-extras --group browser
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Type check
        run: uv run ty check src
      # Catches a module that 3.14 refuses to compile or import, whatever the tests touch.
      - name: Import every module of the package
        run: |
          uv run python - <<'PY'
          import importlib, pkgutil
          import readablestem
          for info in pkgutil.walk_packages(readablestem.__path__, "readablestem."):
              importlib.import_module(info.name)
          PY

  pytest:
    name: pytest (${{ matrix.name }})
    needs: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      PYTHON: ${{ matrix.python }}
      SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras --group browser
      # Includes tests/test_gold_sample.py: known-correct LaTeX must match the gold sample.
      # On 3.12 the Postgres tests also run, against the embedded pgserver. The suite is
      # split by `--shard` (tests/_sharding.py): files are dealt to the shards by recorded
      # duration, tests/shard_durations.json. A file with no recorded time still lands in
      # exactly one shard, and `shard-coverage` fails the run if any test ran in none.
      - name: Pytest (offline; live OpenStax and model tests are opt-in)
        run: |
          mkdir -p shard-reports
          uv run pytest -n auto --shard "$SHARD" \
            --shard-report "shard-reports/shard-${PYTHON}-${SHARD%/*}.json"
      - name: Keep the shard report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shard-report-${{ matrix.python }}-${{ strategy.job-index }}
          path: shard-reports/
          if-no-files-found: ignore
          retention-days: 3

  # Every test in the collection must have run in exactly one shard, on each Python that
  # ran the full suite. This is what makes a new test file safe without touching the
  # durations file. Standard library only: no install.
  shard-coverage:
    name: every test ran in exactly one shard
    needs: [changes, pytest]
    if: ${{ !cancelled() && needs.pytest.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      SHARDS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: shard-report-*
          path: reports
      - name: Python 3.12
        run: |
          mkdir r312 && cp reports/*/shard-3.12-*.json r312/
          python3 scripts/check_shards.py r312 "$SHARDS"
      - name: Python 3.14 (full runs only)
        if: ${{ needs.changes.outputs.full314 == 'true' }}
        run: |
          mkdir r314 && cp reports/*/shard-3.14-*.json r314/
          python3 scripts/check_shards.py r314 "$SHARDS"

  # One name for branch protection to require instead of each job above: it fails when any
  # job that ran failed or was cancelled, and passes when the rest were skipped by design.
  ci-passed:
    name: CI passed
    needs: [changes, static, pytest, shard-coverage, proof-replay, site, postgres, browser, dependency-audit, docker, eval-gate, secret-scan]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RESULTS: ${{ join(needs.*.result, ' ') }}
    steps:
      - run: |
          echo "job results: $RESULTS"
          case " $RESULTS " in *" failure "*|*" cancelled "*) exit 1;; esac

  proof-replay:
    name: make proof (replay of the recorded run)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UV_NO_DEV: "1"  # so that `uv run` in the make targets does not install the dev group
      # Where the tag's code looks for the table-structure model (TABLE_MODEL_DIR).
      TABLE_MODEL_DIR: ${{ github.workspace }}/table-model
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      # The recorded run belongs to the pipeline as it was at the tag proof-heldout-2026-10
      # (Makefile PROOF_TAG; tests/test_proof_pin.py keeps the names equal). Later commits
      # change model requests, so their replay misses recorded answers, by design. This job
      # therefore checks the recording's integrity on the branch head and replays it at the
      # tag, in a second directory. The tag must exist on the remote (it is pushed, never
      # moved). Replay needs no key, no browser and no network: it feeds the committed model
      # answers through the real pipeline and scoring code. The job fails if the pins or the
      # bundle's hashes do not match, if the replay does not reproduce the recorded numbers,
      # or if the committed PROOF.md at the tag is not what the command writes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: proof-heldout-2026-10
          path: at-tag
          persist-credentials: false
      - name: Install (locked, no dev tools, no browser)
        run: uv sync --locked --no-dev
      - name: Check the pins and the recorded run (branch head)
        run: make proof-check
      - name: Install at the tag (locked, no dev tools, no browser)
        working-directory: at-tag
        run: uv sync --locked --no-dev
      # The recorded run was made with the SLANet-plus table-structure model present. It is
      # not in the repository (7.5 MB, Apache-2.0, pinned by SHA-256 in the tag's
      # pipeline/table_model.py). Without it tables fall back to PyMuPDF's grid, the model
      # requests differ, and the replay stops with "64 request(s) have no recorded answer".
      # The cache key names the pinned checksum; the tag's own `make table-model` fetches
      # the file and refuses anything that does not match that checksum.
      - name: Cache the table-structure model
        id: table-model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: table-model
          key: table-model-slanet-plus-d57a942af6a2f57d6a4a0372573c696a2379bf5857c45e2ac69993f3b334514b
      - name: Fetch the table-structure model (checksum-verified by the tag's code)
        if: steps.table-model-cache.outputs.cache-hit != 'true'
        working-directory: at-tag
        run: |
          for attempt in 1 2 3 4; do
            make table-model && exit 0
            echo "fetch attempt $attempt failed; retrying"; sleep $((attempt * 15))
          done
          exit 1
      - name: Replay at the tag and write PROOF.md
        working-directory: at-tag
        run: make proof
      - name: PROOF.md at the tag is what the command writes
        working-directory: at-tag
        run: git diff --exit-code -- PROOF.md

  site:
    name: make site (static demo, no deploy)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      # The build reads committed files only (no key, no network, no browser). It imports
      # the app's own message and compare helpers, so it needs the locked project install.
      - name: Install (locked)
        run: uv sync --locked
      - name: Build the site
        run: make site
      - name: The site has its pages
        run: |
          test -f site/_build/index.html
          test -f site/_build/examples/index.html
          test -f site/_build/before-after/index.html
      # The same files twice must give the same bytes.
      - name: The build is repeatable
        run: |
          uv run python site/build.py --out site/_build_again
          diff -r site/_build site/_build_again

  postgres:
    name: pytest -m postgres (Postgres 18)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: a11y_test
          # Throwaway container reachable only from this job; no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d a11y_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://postgres@localhost:5432/a11y_test
      TEST_POSTGRES_URL: postgresql+psycopg://postgres@localhost:5432/a11y_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked --all-extras
      # tests/test_ops_backup.py runs pg_dump and pg_restore against the service container
      # (locally pgserver ships them). The client major version must match the service's
      # (postgres:18, as the backup image in .railway/railway.ts). Ubuntu 24.04 packages 16,
      # so the 18 client comes from the PostgreSQL project's apt repository.
      - name: Install the Postgres 18 client tools (pg_dump, pg_restore)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-client-18
          pg_dump --version
      # The service DB is brought to head with the real migrations, then compared with the
      # models: `alembic check` fails when a model change has no migration. Alembic runs
      # `compare_type=True` (migrations/env.py), so a changed column type counts as drift.
      - name: Migrations apply (alembic upgrade head)
        run: uv run alembic upgrade head
      - name: Models and migrations agree (alembic check)
        run: uv run alembic check
      # No exit-code special case: pytest's exit code 5 (no tests collected) fails the job.
      - name: Pytest (Postgres-marked tests only)
        run: uv run pytest -m postgres

  browser:
    name: pytest -m browser (Playwright Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install (locked, with the browser group)
        run: uv sync --locked --all-groups --all-extras
      # Chromium's download is cached by Playwright version (the lock pins it). On a hit
      # `playwright install` finds the browser and only installs the system libraries.
      - name: Cache the Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
      # tests/test_web_browser.py downloads axe-core once, checks its npm integrity hash and
      # keeps it here; the cache saves that download on later runs.
      - name: Cache axe-core
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/axe-core
          key: axe-core-${{ hashFiles('tests/test_web_browser.py') }}
      - name: Install Chromium and its system libraries
        run: uv run playwright install --with-deps chromium
      # The fonts the eval renderer and the browser tests name (eval/render.py: Noto Sans
      # Math, Liberation Serif). Without them Chromium falls back to other fonts and the
      # printed PDFs differ from the ones the tests were written against.
      - name: Install the fonts the printed test pages use
        run: sudo apt-get install -y --no-install-recommends fonts-noto-core fonts-liberation
      # -n 3 on the 4-core runner: each worker runs its own Chromium, and `--dist loadfile`
      # keeps a file's tests on one worker so its module-scoped server and browser start
      # once. Every server binds its own free port and keeps its data in tmp_path_factory,
      # so workers share nothing but the axe-core file, which is written atomically.
      - name: Pytest (browser-marked tests only, including axe-core checks)
        # Exit code 5 (no tests collected) fails the job.
        run: uv run pytest -m browser -n 3 --dist loadfile

  dependency-audit:
    name: pip-audit (locked dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      # Audits every locked package (all groups and extras), exactly as the lock pins them.
      # A known vulnerability fails the job. A vulnerability with no fixed release may be
      # listed in IGNORE below, one `--ignore-vuln <ID>` per line, each with a comment that
      # says why, what would be exploitable and when to remove it. There are none now.
      - name: Export the lock and audit it
        run: |
          set -euo pipefail
          IGNORE=(
            # --ignore-vuln PYSEC-0000-0000  # example: no fix released; <reason>; remove when fixed
          )
          uv export --frozen --all-groups --all-extras --no-emit-project --no-hashes \
            --output-file "$RUNNER_TEMP/audit-requirements.txt"
          uvx pip-audit==2.10.1 --no-deps --disable-pip --strict \
            -r "$RUNNER_TEMP/audit-requirements.txt" "${IGNORE[@]}"

  docker:
    name: docker build (no push)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the image
        run: docker build --tag readablestem:ci .
      # deploy.sh builds with `gcloud builds submit --tag`: a plain `docker build` in Cloud
      # Build's docker 20.10 image, which can use the legacy builder. This runner defaults
      # to BuildKit, so build once more without it to catch BuildKit-only syntax.
      - name: Build again with the legacy builder (as Cloud Build may)
        env:
          DOCKER_BUILDKIT: "0"
        run: docker build --tag readablestem:legacy .
      - name: Smoke test the entry point and the non-root user
        run: |
          docker run --rm readablestem:ci readablestem --version
          docker run --rm readablestem:ci readablestem ops --help
          test "$(docker run --rm readablestem:ci id -u)" = "10001"

  eval-gate:
    name: eval gate (when a baseline exists)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Look for committed baselines (data/eval/baseline-<task>.json)
        id: files
        run: |
          if ls data/eval/baseline-*.json >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::no eval baseline committed yet; gate skipped"
          fi
      - if: steps.files.outputs.present == 'true'
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: "3.12"
          enable-cache: true
      - if: steps.files.outputs.present == 'true'
        name: Install (locked)
        run: uv sync --locked
      - if: steps.files.outputs.present == 'true'
        name: Fail if any task's latest eval regressed against its baseline
        run: |
          set -euo pipefail
          for baseline in data/eval/baseline-*.json; do
            task="${baseline#data/eval/baseline-}"; task="${task%.json}"
            current="data/eval/latest-${task}.json"
            if [ ! -f "$current" ]; then
              echo "::error::$baseline has no matching $current"; exit 1
            fi
            uv run readablestem eval gate --require-current --current "$current" --baseline "$baseline"
          done

  secret-scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Runs the gitleaks CLI directly over the full history. gitleaks-action failed on the
    # repo's first push: it scans "<first commit>^..HEAD", and the root commit has no parent.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1 (checksum-verified)
        run: |
          set -euo pipefail
          V=8.30.1
          base="https://github.com/gitleaks/gitleaks/releases/download/v$V"
          curl -sSfL -o gitleaks.tgz "$base/gitleaks_${V}_linux_x64.tar.gz"
          curl -sSfL -o checksums.txt "$base/gitleaks_${V}_checksums.txt"
          grep "gitleaks_${V}_linux_x64.tar.gz" checksums.txt | sed "s/gitleaks_${V}_linux_x64.tar.gz/gitleaks.tgz/" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan full git history
        # Only the history of the commit under test: with fetch-depth 0 the checkout also has
        # every other branch, and their findings must not fail this one.
        run: ./gitleaks git --redact --verbose --exit-code 1 --log-opts="--full-history HEAD" .
