name: Uptime (weekly)

# A second, outside-in check of the live app, independent of Google Cloud Monitoring.
# Set the repository variable LIVE_URL (Settings > Secrets and variables > Actions >
# Variables), e.g. https://a11y.example.org. Unset: the job passes and does nothing.
# A failed scheduled run is emailed by GitHub (Settings > Notifications > Actions).

on:
  schedule:
    - cron: "17 14 * * 1" # Mondays 14:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: GET /readyz and /demo
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the live app
        env:
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          if [ -z "$LIVE_URL" ]; then
            echo "::notice::repository variable LIVE_URL is not set; nothing to check"
            exit 0
          fi
          base="${LIVE_URL%/}"
          for path in /readyz /demo; do
            curl -fsS --max-time 30 --retry 2 --retry-delay 10 -o /dev/null \
              -w "$path %{http_code} in %{time_total}s\n" "$base$path"
          done
