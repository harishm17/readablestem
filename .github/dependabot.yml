# Weekly update PRs. Minor and patch updates are grouped into one PR per ecosystem;
# major updates come one PR each, so a breaking change is reviewed on its own.
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]

  # Base images in the Dockerfile are pinned by digest; this keeps the digests fresh.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # The image's Python version is a deliberate choice (.python-version, 3.12).
      - dependency-name: python
        update-types: [version-update:semver-minor, version-update:semver-major]
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
