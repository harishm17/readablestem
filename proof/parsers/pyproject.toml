# Parser comparison harness (optional; the app does not depend on it).
#
# This project reads the output of other PDF parsers and scores it with ReadableSTEM's own
# evaluation code. The parsers themselves live in their own environments under arms/, one
# per tool, so that their dependencies (torch, onnxruntime, ...) never meet the app's.
[project]
name = "a11y-parsers-bench"
version = "0.1.0"
description = "Runners, adapters and scoring glue for comparing PDF parsers with ReadableSTEM on OpenStax pages."
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "readablestem",
    "markdown-it-py>=3.0",
    "mdit-py-plugins>=0.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "ty>=0.0.85",
]

[project.scripts]
parsers-bench = "parsers_bench.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "parsers_bench"

[tool.uv.sources]
readablestem = { path = "../..", editable = true }

[tool.ruff]
extend = "../../pyproject.toml"
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
