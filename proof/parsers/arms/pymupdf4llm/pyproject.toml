# Arm P3: PyMuPDF4LLM 1.28.2 with the layout model on. Not a dependency of ReadableSTEM.
# Licence: AGPL-3.0 or Artifex commercial; see proof/parsers/README.md.
[project]
name = "parsers-arm-pymupdf4llm"
version = "0.0.0"
description = "Environment for the PyMuPDF4LLM arm of the parser comparison (pins only)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "pymupdf4llm==1.28.2",
    "pymupdf==1.28.2",
    # With this installed, pymupdf4llm.to_markdown uses the layout model (the plan's setting).
    "pymupdf-layout==1.28.2",
]

[tool.uv]
package = false
