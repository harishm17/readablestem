# Arm P1 / P1f: Docling, CPU only. Not a dependency of ReadableSTEM.
# Docling is MIT. Its models carry their own licences (proof/parsers/README.md).
[project]
name = "parsers-arm-docling"
version = "0.0.0"
description = "Environment for the Docling arm of the parser comparison (pins only)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "docling==2.138.0",
    # Docling pulls torch; pin the CPU wheels explicitly so the lock does not pick CUDA ones.
    "torch==2.14.1",
    "torchvision==0.29.1",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
