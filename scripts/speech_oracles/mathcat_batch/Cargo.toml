[package]
name = "mathcat-batch"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reads MathML as JSON lines and speaks it with MathCAT (the engine behind NVDA and JAWS)."

[dependencies]
# Pinned to the release scripts/speech_oracles/build.sh checks out; keep the two in step.
libmathcat = { package = "mathcat", git = "https://github.com/NSoiffer/MathCAT", rev = "764d24d1241b20c0973e9dbcee62d022c1f99a4a" }
sxd_document_no_unsafe = { package = "sxd-document-no-unsafe", version = "0.4.2" }
serde_json = "1"

[workspace]
